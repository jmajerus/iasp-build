name: Release

# Publishes the wheel and sdist to PyPI and to a GitHub Release, so
# manuscripts can install a compatible version with pip.
#
# PyPI upload uses trusted publishing (OIDC), so there is no token. It
# needs a trusted publisher on PyPI for this repository, workflow file
# release.yml and environment "pypi".
#
# Two ways to cut a release:
#   * Actions → Release → Run workflow, choosing patch/minor/major. The
#     workflow bumps pyproject.toml, commits "Release X.Y.Z" to main, and
#     releases it.
#   * Bump the version in pyproject.toml yourself and merge it to main.
#     The push starts this workflow, which releases the new version.
#
# Running it with bump "none" publishes the version already on main, or
# backfills a release for an existing tag that has none (it builds from
# the tag, not from main).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase before releasing
        type: choice
        options: [patch, minor, major, none]
        default: patch
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write
  id-token: write # PyPI trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/iasp-build/
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A push run builds the commit that triggered it, even if main has
          # moved on since. A manual run always releases main, whichever
          # branch it was started from, because its bump is pushed to main.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'EOF'
          import os, re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"$', text, re.M)
          if not match:
              raise SystemExit("No X.Y.Z version line in pyproject.toml")
          major, minor, patch = map(int, match.groups())
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new = f"{major}.{minor}.{patch}"
          path.write_text(text[: match.start()] + f'version = "{new}"' + text[match.end() :])
          print(f"Bumped to {new}")
          EOF

      - name: Read version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push that edits pyproject.toml without changing the version
          # (dependencies, metadata) is not a release.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            previous=$(git show "$BEFORE:pyproject.toml" 2>/dev/null \
              | python -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])" 2>/dev/null || true)
            if [ "$previous" = "$VERSION" ]; then
              echo "Version $VERSION is unchanged; nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Tag $TAG already exists. Bump to a version that has no tag."
              exit 1
            fi
            echo "Tag $TAG exists without a release; building from the tag."
            git checkout -q "$TAG"
          fi

      - name: Install Pandoc
        if: steps.existing.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Run tests
        if: steps.existing.outputs.skip != 'true'
        run: |
          python -m pip install '.[test]' build
          python -m pytest -q

      - name: Build wheel and sdist
        if: steps.existing.outputs.skip != 'true'
        run: |
          rm -rf dist
          python -m build

      - name: Commit version bump
        if: steps.existing.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push origin HEAD:main

      # Before the GitHub Release: a rerun skips versions that already have
      # one, so PyPI must not be left behind. skip-existing makes a rerun
      # after a failed GitHub Release step safe.
      - name: Publish to PyPI
        if: steps.existing.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub Release
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iasp-build"
version = "0.1.4"
description = "Pandoc-based build tools for manuscripts using the Informative Authoring Semantics Profile"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
kdp = ["Pillow>=9"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jmajerus/iasp-build"
Documentation = "https://github.com/jmajerus/iasp-build/tree/main/docs"
Changelog = "https://github.com/jmajerus/iasp-build/releases"

[project.scripts]
iasp-build = "iasp_tooling.cli:main"

[tool.setuptools.packages.find]
include = ["iasp_tooling", "iasp_tooling.*"]

[tool.setuptools.package-data]
iasp_tooling = ["lua/*.lua", "lua/iasp/*.lua", "latex/*.tex", "styles/*.css", "vocab/*.ttl"]

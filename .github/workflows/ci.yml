name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and the version manuscripts use.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ubuntu 24.04 ships Pandoc 3.1.3. The tests need only Pandoc; none
      # of them build a PDF, so XeLaTeX is not installed.
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          pandoc --version | head -1

      - name: Install package
        run: python -m pip install '.[test]'

      - name: Run tests
        run: python -m pytest -q
